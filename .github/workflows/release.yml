name: Release

# Publishes the GitHub Release for a version tag, using that version's section of CHANGELOG.md.
# It does not publish to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const v = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith("## [" + v + "]"));
            if (start === -1) {
              console.error("CHANGELOG.md has no section for version " + v + ". Add it, then re-run this workflow.");
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && l.startsWith("## ["));
            if (end === -1) end = lines.findIndex((l, i) => i > start && /^\[[^\]]+\]: /.test(l));
            if (end === -1) end = lines.length;
            const body = lines.slice(start + 1, end).join("\n").trim();
            if (!body) {
              console.error("The CHANGELOG.md section for " + v + " is empty.");
              process.exit(1);
            }
            fs.writeFileSync("notes.md", body + "\n");
          '
          echo "Release notes:"
          cat notes.md

      - name: Create or update the GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AgentWatch $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --title "AgentWatch $VERSION" --notes-file notes.md --verify-tag
          fi
